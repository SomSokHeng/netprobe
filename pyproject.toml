[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "1.0.0"
description = "Network reachability, TLS certificate, and HTTP security header auditor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
cert = ["cryptography>=38.0"]

[project.scripts]
netprobe = "netprobe.cli:main"

[tool.setuptools]
packages = ["netprobe"]
